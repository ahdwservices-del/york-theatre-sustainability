<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Bin? Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: scrub-teal masthead, wide working column, waste streams carry their real bag and lid colours as the only loud colour on the page. */
:root{
  --bg:#f1f5f4; --surface:#ffffff; --ink:#10302f; --muted:#51696a; --line:#d3dedc;
  --accent:#0b6e69; --accent-ink:#ffffff; --accent-soft:#dcefec; --hero:#0c3f3d; --hero-ink:#eef7f5;
  --warn:#9a3412; --warn-soft:#fdeee4;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a1a; --surface:#132524; --ink:#e6f1ef; --muted:#9db5b3; --line:#27403e;
    --accent:#5fd0c5; --accent-ink:#062a28; --accent-soft:#173836; --hero:#0a2e2c; --hero-ink:#eef7f5;
    --warn:#fdba8c; --warn-soft:#3a2416; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a1a; --surface:#132524; --ink:#e6f1ef; --muted:#9db5b3; --line:#27403e;
  --accent:#5fd0c5; --accent-ink:#062a28; --accent-soft:#173836; --hero:#0a2e2c; --hero-ink:#eef7f5;
  --warn:#fdba8c; --warn-soft:#3a2416; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* masthead */
header.top{background:var(--hero);color:var(--hero-ink);position:sticky;top:0;z-index:5}
.topbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 20px;max-width:1120px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--hero-ink);text-decoration:none;margin-right:auto;display:flex;gap:10px;align-items:center}
.brand i{width:14px;height:14px;border-radius:50%;background:#5fd0c5;display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--hero-ink);text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.92rem;font-weight:500;opacity:.85}
nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
nav a[aria-current="page"]{background:#5fd0c5;color:#062a28;opacity:1;font-weight:600}

.view{display:none;padding:0 0 72px}
.view.on{display:block}
.pagehead{padding:40px 0 8px}
.pagehead p{color:var(--muted);margin-top:10px;font-size:1.05rem}
section.block{padding:32px 0 0}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem var(--body);padding:12px 20px;border-radius:999px;border:2px solid transparent;cursor:pointer;text-decoration:none}
.btn.primary{background:#5fd0c5;color:#062a28}
.btn.ghost{border-color:rgba(255,255,255,.4);color:var(--hero-ink);background:transparent}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.line{border-color:var(--line);color:var(--ink);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.card .go{margin-top:auto;color:var(--accent);font-weight:600;font-size:.92rem;padding-top:6px}
.pill{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.plan{background:var(--warn-soft);color:var(--warn)}
.qwrap{max-width:760px;margin:0 auto;padding:0 20px 56px}
.qhead{padding:28px 0 10px;display:flex;flex-direction:column;gap:8px}
.qhead p{color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mode{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--display);font-size:1.25rem}
.mode span{color:var(--muted);font-size:.92rem}
.bar{display:flex;align-items:center;gap:12px;margin:18px 0 12px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.qcard:focus{outline:none}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.qkind{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.7rem);font-weight:700;line-height:1.2}
.qctx{display:inline-block;align-self:flex-start;background:var(--warn-soft);color:var(--warn);font-weight:600;padding:4px 12px;border-radius:999px;font-size:.92rem}
.bins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.binbtn{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font:600 .74rem var(--body);text-align:center;line-height:1.15}
.binbtn svg{width:46px;height:56px;display:block}
@media (hover:hover){#app:not(.fresh) .binbtn:hover:not(:disabled){border-color:var(--accent)}}
.binbtn:disabled{cursor:default}
.binbtn.right{border-color:#16a34a;background:#dcfce7;color:#14532d}
.binbtn.wrong{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.binbtn.dim{opacity:.45}
.tfrow,.mcrow{display:grid;gap:10px}
.tfrow{grid-template-columns:1fr 1fr}
.choice{font:700 1.05rem var(--body);padding:16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
@media (hover:hover){#app:not(.fresh) .choice:hover:not(:disabled){border-color:var(--accent)}}
.choice.right{border-color:#16a34a;background:#dcfce7;color:#14532d}
.choice.wrong{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.fb{border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:#dcfce7;color:#14532d}.fb.no{background:#fee2e2;color:#7f1d1d}
.fb svg{width:44px;height:52px;flex:none;background:#fff;border-radius:6px;padding:2px}
.fb b{display:block;font-size:1.05rem}
.fb p{margin-top:2px}
.next{align-self:flex-end}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.result>.score,.result>.score+p,.result>.tally{text-align:center}
.face{display:block;margin:0 auto -4px;align-self:center;width:120px;height:120px;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.face .sp{animation:twinkle 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.face .sp:nth-of-type(2){animation-delay:.35s}.face .sp:nth-of-type(3){animation-delay:.7s}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion:reduce){.face,.face .sp{animation:none}}
.tally{margin-top:14px;font-size:.92rem;color:var(--muted)}
.tally b{color:var(--accent)}
/* Refresher shown after a score under 70% */
.rf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.rfdots{display:flex;gap:6px}.rfdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.rfdots i.on{background:var(--accent)}
.rf h2{font-size:1.5rem}
.rfmiss{align-self:flex-start;font-size:.8rem;font-weight:700;background:#fee2e2;color:#7f1d1d;padding:3px 10px;border-radius:999px}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.flip{border:2px dashed var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font:600 .95rem var(--body);text-align:center;min-height:150px;justify-content:center}
.flip svg{width:52px;height:62px}
.flip .hint{font-size:.78rem;font-weight:600;color:var(--accent)}
.flip.open{border-style:solid;border-color:var(--accent);background:var(--surface);cursor:default}
.flip.open p{font-weight:500;font-size:.92rem;line-height:1.4}
.flip.open{animation:flipin .35s ease-out}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.flip.open{animation:none}}
.tip{background:#fff7de;color:#5c4300;border-radius:10px;padding:12px 14px;font-size:.95rem}
.chk{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.chk[hidden]{display:none}
.chk .bins{grid-template-columns:repeat(3,1fr)}
.rfgate{background:#fff7de;border-radius:12px;padding:16px;color:#5c4300}
.rfgate b{display:block;font-size:1.1rem;color:#3d2e00;margin-bottom:4px}
.score{font-family:var(--display);font-size:clamp(2.6rem,8vw,3.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--muted);font-weight:500}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.missed li{border-left:4px solid #dc2626;padding:6px 0 6px 12px}
.missed li b{display:block}
.missed li span{color:var(--muted);font-size:.92rem}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.ref{font-size:.82rem;color:var(--muted)}
.pbar{flex-wrap:wrap}.pbar .btn{padding:6px 14px;font-size:.88rem}
.tsel{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.tsel select{font:500 .9rem var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0;max-width:340px}
@media (max-width:520px){.pbar .tsel{flex-basis:100%;order:3}}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.85rem}
@media (max-width:820px){header.top{position:static}}
@media (max-width:520px){.modes{grid-template-columns:1fr}.binbtn svg{width:34px;height:42px}.binbtn{font-size:.62rem;padding:6px 2px}.bins{gap:5px}.qcard{padding:16px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

const QS=[{"id": 1, "t": "bin", "item": "Paper hand towel after washing your hands", "ctx": "", "a": "black", "why": "Hand towels spoil dry mixed recycling, and they haven't touched a patient."}, {"id": 2, "t": "bin", "item": "Outer cardboard box from a drape delivery", "ctx": "", "a": "clear", "why": "Clean card is recyclable."}, {"id": 3, "t": "bin", "item": "Outer layer of sterile wrap", "ctx": "Opened in the anaesthetic room", "a": "clear", "why": "The outer layer is clean plastic that never touched the patient."}, {"id": 4, "t": "bin", "item": "Empty disposable coffee cup", "ctx": "", "a": "black", "why": "Cups have a plastic lining that recycling can't take."}, {"id": 5, "t": "bin", "item": "Empty plastic drinks bottle", "ctx": "", "a": "clear", "why": "Empty, clean plastic bottles are recyclable."}, {"id": 6, "t": "bin", "item": "Sandwich wrapper", "ctx": "", "a": "black", "why": "Food-contaminated packaging is general waste."}, {"id": 7, "t": "bin", "item": "Empty propofol vial", "ctx": "", "a": "blue", "why": "A medicine container with no sharp goes to pharmaceutical waste."}, {"id": 8, "t": "bin", "item": "Blister pack from paracetamol tablets", "ctx": "", "a": "blue", "why": "Medicine packaging with residue goes to pharmaceutical waste."}, {"id": 9, "t": "bin", "item": "Empty glass ampoule", "ctx": "After drawing up", "a": "blue", "why": "Empty ampoules go with vials as pharmaceutical waste, not in the sharps bin."}, {"id": 10, "t": "bin", "item": "Needle used to draw up a drug", "ctx": "", "a": "yellowsharps", "why": "A sharp that has touched a medicine."}, {"id": 11, "t": "bin", "item": "Scalpel blade", "ctx": "Used on the patient, no drugs", "a": "orangesharps", "why": "Blood-only sharps go orange-lid, where the metal is recovered."}, {"id": 12, "t": "bin", "item": "Single-use metal scissors", "ctx": "From the scrub field, no drugs", "a": "orangesharps", "why": "Metal is only recycled from the orange-lid stream."}, {"id": 13, "t": "bin", "item": "Needle used to give methotrexate", "ctx": "", "a": "purple", "why": "Cytotoxic sharps never go in the yellow-lid bin."}, {"id": 14, "t": "bin", "item": "Gloves worn for intravesical mitomycin", "ctx": "", "a": "purple", "why": "PPE contaminated with a cytotoxic drug is cytotoxic waste."}, {"id": 15, "t": "bin", "item": "Recognisable tissue", "ctx": "Not sent to histology", "a": "red", "why": "Recognisable human tissue is anatomical waste."}, {"id": 16, "t": "bin", "item": "Gloves and apron", "ctx": "Non-infectious patient, no drugs", "a": "tiger", "why": "Body-fluid contact without infection is offensive waste."}, {"id": 17, "t": "bin", "item": "Gloves and apron", "ctx": "Patient with C. difficile", "a": "orangebag", "why": "An infectious patient makes the same PPE infectious waste."}, {"id": 18, "t": "bin", "item": "Blood-stained swabs", "ctx": "Non-infectious patient", "a": "tiger", "why": "Blood alone does not make waste infectious."}, {"id": 19, "t": "bin", "item": "Blood-stained swabs", "ctx": "Patient with suspected TB", "a": "orangebag", "why": "Suspected infection counts as infection."}, {"id": 20, "t": "bin", "item": "Empty saline bag and giving set", "ctx": "Nothing added, non-infectious patient", "a": "tiger", "why": "Not recycling: the port can draw back body fluid. No medicine, so not yellow."}, {"id": 21, "t": "bin", "item": "Saline bag and giving set", "ctx": "Potassium chloride added, no needle", "a": "yellowbag", "why": "Anything a medicine was added to goes yellow."}, {"id": 22, "t": "bin", "item": "Giving set", "ctx": "A needle is still on the end", "a": "yellowsharps", "why": "Always check the line end. If there's a needle, the whole assembly is a sharp."}, {"id": 23, "t": "bin", "item": "Line from an oxytocin infusion", "ctx": "No needle", "a": "yellowbag", "why": "Medicine-contaminated, no sharp."}, {"id": 24, "t": "bin", "item": "Saline bag, nothing added", "ctx": "Patient with norovirus", "a": "orangebag", "why": "No medicine, but the patient is i     :r>=0.8?'<path d="M36 68 Q60 92 84 68" stroke="#10302f" stroke-width="6" fill="none" stroke-linecap="round"/>'
    :'<path d="M40 72 Q60 86 80 72" stroke="#10302f" stroke-width="6" fill="none" stroke-linecap="round"/>';
  const eyes=r===1?'<path d="M36 50 Q43 40 50 50M70 50 Q77 40 84 50" stroke="#10302f" stroke-width="6" fill="none" stroke-linecap="round"/>'
    :'<circle cx="43" cy="48" r="6" fill="#10302f"/><circle cx="77" cy="48" r="6" fill="#10302f"/>';
  const sp=r===1?'<path class="sp" d="M8 22l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#f5b400"/><path class="sp" d="M110 12l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#0b6e69"/><path class="sp" d="M108 96l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f2777a"/>':"";
  return `<svg class="face" viewBox="-4 0 128 120" role="img" aria-label="Smiley face"><circle cx="60" cy="60" r="48" fill="#ffd23f" stroke="#e0a800" stroke-width="3"/><circle cx="32" cy="70" r="7" fill="#f7a072" opacity=".55"/><circle cx="88" cy="70" r="7" fill="#f7a072" opacity=".55"/>${eyes}${mouth}${sp}</svg>`;
}
function countRound(n,retry){
  if(!COUNT_URL)return;
  fetch(COUNT_URL,{method:"POST",body:new URLSearchParams({kind:"quiz",mode,score:String(score),outOf:String(n),retry:retry?"1":"0"})})
    .then(r=>r.json()).then(j=>{const t=$("#tally");if(t&&j&&j.count>0)t.innerHTML=`You've just completed quiz number <b>${j.count.toLocaleString("en-GB")}</b> across our theatres.`}).catch(()=>{});
}

// ---- Refresher: required after a full round scoring under 70% ----
const PASS=0.7;
const LESSONS=[
 {q:"Is it sharp?",rule:"Sharps always go in a sharps bin. The lid colour depends on what's on it.",
  cards:{orangesharps:"Blood only, no drugs. The metal gets recycled from this bin.",yellowsharps:"It touched a drug: needles used to draw up or give.",purple:"Chemotherapy. Never the yellow lid."},
  tip:"A line with a needle still on the end? The whole thing is a sharp.",
  chk:{item:"Single-use metal scissors, no drugs on them",opts:["orangesharps","yellowsharps","purple"],a:"orangesharps",why:"No drugs, so the orange lid, where the metal is recovered."},
  covers:["orangesharps","yellowsharps","purple"]},
 {q:"Has a medicine touched it?",rule:"Not sharp, but a drug is on it? It goes to one of the medicine streams.",
  cards:{blue:"Vials, ampoules, blister packs, and syringes with drug left in (needle off).",yellowbag:"IV bags, lines and circuits a drug was added to or run through."},
  tip:"An empty vial is not a sharp. Sharps bins cost more to treat.",
  chk:{item:"Empty propofol vial",opts:["yellowsharps","blue","yellowbag"],a:"blue",why:"A medicine container with no sharp goes in the blue-lid burn bin."},
  covers:["blue","yellowbag"]},
 {q:"Is the patient infectious?",rule:"Used on a patient, not sharp, no drugs? Now it only depends on infection.",
  cards:{tiger:"Not infectious: gloves, aprons, swabs, drapes, LMAs, plain IV bags.",orangebag:"Infectious, or infection suspected: the same items go here instead."},
  tip:"Blood alone does not make waste infectious. Suspected infection counts as infection.",
  chk:{item:"Blood-stained swabs from a patient who isn't infectious",opts:["orangebag","tiger","yellowbag"],a:"tiger",why:"Blood alone doesn't make it infectious, so the tiger bag."},
  covers:["tiger","orangebag"]},
 {q:"Never touched a patient?",rule:"Clean waste is the cheapest to deal with. Keep it out of the patient bags.",
  cards:{clear:"Clean card, paper, plastic wrappers, the outer layer of sterile wrap, empty bottles.",black:"Hand towels, coffee cups and food wrappers."},
  tip:"Most packaging is opened before the patient arrives, so it's still clean.",
  chk:{item:"Empty disposable coffee cup",opts:["clear","black","tiger"],a:"black",why:"Cups have a plastic lining that recycling can't take, so the black bag."},
  covers:["clear","black"]},
 {q:"Two last rules",rule:"Recognisable tissue goes in the red-lid bin. And no bag takes free liquid: solidify it first.",
  cards:{red:"Recognisable human tissue that isn't going to the lab."},
  tip:"The cost ladder: tiger is cheapest, orange costs more, yellow costs most. Using orange instead of tiger 'to be safe' just costs more.",
  chk:{item:"Which bag usually costs most to dispose of?",opts:["tiger","orangebag","yellowbag"],a:"yellowbag",why:"Yellow goes to high-temperature incineration."},
  covers:["red",null,"mc"]}
];
const NEED="yts-quiz-refresher";
// Remembers (in this browser only) that a refresher is due, plus which questions were missed.
const needRefresher=()=>{try{const v=JSON.parse(localStorage.getItem(NEED)||"null");if(v&&Array.isArray(v.ids)){rfMissed=QS.filter(q=>v.ids.includes(q.id));rfMode=v.mode||"practice";return true}}catch(e){}return false};
const setNeed=v=>{try{v?localStorage.setItem(NEED,JSON.stringify({ids:rfMissed.map(q=>q.id),mode:rfMode})):localStorage.removeItem(NEED)}catch(e){}};
let rfMissed=[],rfMode="practice";
function lessonOf(q){const k=q.t==="bin"?q.a:q.t==="tf"?q.bin:"mc";return LESSONS.findIndex(L=>L.covers.includes(k))}
function refresher(step){
  const L=LESSONS[step],n=LESSONS.length;
  const missN=rfMissed.filter(q=>lessonOf(q)===step).length;
  const keys=Object.keys(L.cards);let opened=new Set();
  $("#app").innerHTML=`<div class="rf">
   <div class="rfdots" aria-label="Step ${step+1} of ${n}">${LESSONS.map((_,j)=>`<i class="${j<=step?"on":""}"></i>`).join("")}</div>
   <span class="pill">Refresher · ${step+1} of ${n}</span>
   <h2>${esc(L.q)}</h2>${missN?`<span class="rfmiss">You missed ${missN} like this</span>`:""}
   <p>${esc(L.rule)}</p>
   <div class="flips">${keys.map(k=>`<button type="button" class="flip" data-k="${k}">${ART[k]()}<span>${esc(STREAMS[k].name)}</span><span class="hint">Tap to see what goes in</span></button>`).join("")}</div>
   <p class="tip">${esc(L.tip)}</p>
   <div class="chk" id="chk" hidden><b>Quick check: ${esc(L.chk.item)}</b><div class="bins">${L.chk.opts.map(k=>`<button type="button" class="binbtn" data-k="${k}">${ART[k]()}${esc(STREAMS[k].name)}</button>`).join("")}</div><div id="cfb"></div></div>
   <div style="display:flex;justify-content:flex-end"><button class="btn solid" type="button" id="rnx" disabled>${step+1<n?"Next":"Finish"}</button></div>
  </div>`;
  window.scrollTo(0,0);
  document.querySelectorAll(".flip").forEach(b=>b.onclick=()=>{if(b.classList.contains("open"))return;const k=b.dataset.k;
    b.classList.add("open");b.innerHTML=`${ART[k]()}<span>${esc(STREAMS[k].name)}</span><p>${esc(L.cards[k])}</p>`;opened.add(k);
    if(opened.size===keys.length){$("#chk").hidden=false}});
  document.querySelectorAll("#chk .binbtn").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.k===L.chk.a;
    if(ok){document.querySelectorAll("#chk .binbtn").forEach(x=>{x.disabled=true;x.classList.toggle("right",x===b);x.classList.toggle("dim",x!==b)});$("#rnx").disabled=false}
    else{b.classList.add("wrong");b.disabled=true}
    $("#cfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div><b>${ok?"Yes!":"Not quite, try again."}</b>${ok?`<p>${esc(L.chk.why)}</p>`:""}</div></div>`;
  });
  $("#rnx").onclick=()=>step+1<n?refresher(step+1):refresherDone();
}
function refresherDone(){
  setNeed(false);
  $("#app").innerHTML=`<div class="result">${face(1)}<div class="score" style="font-size:2rem">Refresher done</div><p style="text-align:center">Five questions to ask: is it sharp, has a drug touched it, is the patient infectious, has it touched a patient at all, and is it tissue? Ready for another go?</p>
   <div class="acts">${rfMissed.length?`<button class="btn solid" type="button" id="rm">Retry the ${rfMissed.length} I missed</button>`:""}<button class="btn ${rfMissed.length?"line":"solid"}" type="button" id="nr">Take the test again</button><button class="btn line" type="button" id="hm">Quiz menu</button></div></div>`;
  window.scrollTo(0,0);
  const rm=$("#rm");if(rm)rm.onclick=()=>start("practice",shuffle(rfMissed.slice()));
  $("#nr").onclick=()=>start("test");$("#hm").onclick=home;
}
function finish(){
  if(mode==="practice"){
    $("#app").innerHTML=`<div class="result"><div class="score" style="font-size:2rem">Practice done</div><p>You looked at ${answered} question${answered===1?"":"s"}.${missed.length?" These are worth another look:":" Nothing to go back over."}</p>
     ${missed.length?`<ul class="missed">${missed.map(q=>`<li><b>${esc(q.item)}${q.ctx?` (${esc(q.ctx)})`:""}</b><span>${esc(q.t==="bin"?STREAMS[q.a].name+". ":q.t==="tf"?(q.a?"Right. ":"Wrong. "):q.opts[q.a]+". ")}${esc(q.why)}</span></li>`).join("")}</ul>`:""}
     <div class="acts">${missed.length?`<button class="btn solid" type="button" id="rm">Practise these ${missed.length} again</button>`:""}<button class="btn ${missed.length?"line":"solid"}" type="button" id="nr">Keep practising</button><button class="btn line" type="button" id="ts">Test yourself</button></div></div>`;
    const rm=$("#rm");if(rm){const m=missed.slice();rm.onclick=()=>start("practice",shuffle(m))}
    $("#nr").onclick=()=>start("practice");$("#ts").onclick=()=>needRefresher()?refresher(0):start("test");
    window.scrollTo(0,0);return;
  }
  const n=round.length;
  const gate=score/n<PASS;
  const msg=gate?"Let's go over the rules before your next go.":score===n?"Perfect score.":score>=n*0.8?"Good. Check the ones you missed below.":"A pass, but worth another look at the rules below.";
  $("#app").innerHTML=`<div class="bar"><span>Finished</span><div class="prog" aria-hidden="true"><i style="width:100%"></i></div><span>Score ${score}</span></div>
  <div class="result">${face(score/n)}<div class="score">${score}<small> / ${n}</small></div><p>${msg}</p><p class="tally" id="tally"></p>
   ${gate?`<div class="rfgate"><b>Quick refresher</b>Five short steps, about 3 minutes. Tap the bins to see what goes in each, then answer one quick check per step. After that you can take the test again.</div>
   <div class="acts"><button class="btn solid" type="button" id="rf">Start the refresher</button><button class="btn line" type="button" id="hm">Quiz menu</button></div>`:""}
   ${missed.length?`<h2 style="font-size:1.2rem">Missed</h2><ul class="missed">${missed.map(q=>`<li><b>${esc(q.item)}${q.ctx?` (${esc(q.ctx)})`:""}</b><span>${esc(q.t==="bin"?STREAMS[q.a].name+". ":q.t==="tf"?(q.a?"Right. ":"Wrong. "):q.opts[q.a]+". ")}${esc(q.why)}</span></li>`).join("")}</ul>`:""}
   ${gate?"":`<div class="acts">${missed.length?`<button class="btn solid" type="button" id="rm">Practise the ${missed.length} I missed</button>`:""}<button class="btn ${missed.length?"line":"solid"}" type="button" id="nr">New test</button><button class="btn line" type="button" id="hm">Quiz menu</button></div>`}</div>`;
  if(gate){rfMissed=missed.slice();rfMode="test";setNeed(true);$("#rf").onclick=()=>refresher(0);$("#hm").onclick=home}
  else{const rm=$("#rm");if(rm){const m=missed.slice();rm.onclick=()=>start("practice",shuffle(m))}
  $("#nr").onclick=()=>start("test");$("#hm").onclick=home;}
  window.scrollTo(0,0);
  countRound(n,false);
}
home();
</script>
</body>
</html>
